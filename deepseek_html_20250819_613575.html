<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>四川话猜意思游戏 - Readymag版</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Microsoft YaHei', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #ff8a00, #e52e71);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }
        
        .game-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 350px;
            padding: 18px;
            text-align: center;
        }
        
        .header {
            margin-bottom: 15px;
        }
        
        .header h1 {
            color: #e52e71;
            font-size: 20px;
            margin-bottom: 6px;
        }
        
        .header p {
            color: #666;
            font-size: 12px;
        }
        
        .panda-icon {
            font-size: 24px;
            margin-bottom: 8px;
        }
        
        .question-container {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 15px;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.05);
        }
        
        .question-number {
            color: #ff8a00;
            font-weight: bold;
            font-size: 12px;
            margin-bottom: 6px;
        }
        
        .question {
            font-size: 16px;
            color: #333;
            margin-bottom: 8px;
            line-height: 1.4;
        }
        
        .options-container {
            display: grid;
            grid-gap: 6px;
            margin-bottom: 12px;
        }
        
        .option {
            background: white;
            border: 1.5px solid #ddd;
            border-radius: 8px;
            padding: 10px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
        }
        
        .option:hover {
            border-color: #ff8a00;
            background: #fff9f0;
        }
        
        .option.selected {
            border-color: #ff8a00;
            background: #fff9f0;
        }
        
        .option.correct {
            border-color: #4caf50;
            background: #e8f5e9;
        }
        
        .option.incorrect {
            border-color: #f44336;
            background: #ffebee;
        }
        
        .button {
            background: #ff8a00;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            margin: 4px;
        }
        
        .button:hover {
            background: #e52e71;
            transform: translateY(-1px);
        }
        
        .button:active {
            transform: translateY(0);
        }
        
        .button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .result-container {
            display: none;
            background: #f8f9fa;
            border-radius: 10px;
            padding: 12px;
            margin-top: 12px;
        }
        
        .correct {
            color: #4caf50;
            font-weight: bold;
            font-size: 14px;
        }
        
        .incorrect {
            color: #f44336;
            font-weight: bold;
            font-size: 14px;
        }
        
        .answer {
            margin-top: 8px;
            font-size: 14px;
            color: #333;
        }
        
        .score {
            margin-top: 10px;
            font-size: 14px;
            color: #666;
        }
        
        .hint {
            color: #666;
            font-size: 11px;
            margin-top: 6px;
        }
        
        .footer {
            margin-top: 12px;
            color: #666;
            font-size: 10px;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <div class="panda-icon">🐼</div>
            <h1>四川话猜意思</h1>
            <p>测试你的四川方言理解能力</p>
        </div>
        
        <div class="question-container">
            <div class="question-number">问题 1/5</div>
            <div class="question" id="question">摆龙门阵的意思是什么？</div>
            <div class="hint">请从下列选项中选择正确答案</div>
        </div>
        
        <div class="options-container" id="options-container">
            <!-- 选项将由JavaScript动态生成 -->
        </div>
        
        <button class="button" id="submit-btn" disabled>提交答案</button>
        <button class="button" id="next-btn" style="display: none;">下一题</button>
        
        <div class="result-container" id="result-container">
            <div id="result-message"></div>
            <div class="answer" id="correct-answer"></div>
            <div class="score" id="score">得分: 0/5</div>
        </div>
        
        <div class="footer">
            <p>© 2023 四川话学习游戏</p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const questions = [
                {
                    question: "摆龙门阵的意思是什么？",
                    options: ["打架", "闲聊天", "做饭", "逛街"],
                    answer: "闲聊天"
                },
                {
                    question: "瓜娃子是什么意思？",
                    options: ["卖瓜的人", "傻子", "聪明人", "小孩"],
                    answer: "傻子"
                },
                {
                    question: "巴适是什么意思？",
                    options: ["不舒服", "便宜", "舒服、合适", "快速"],
                    answer: "舒服、合适"
                },
                {
                    question: "幺妹儿是什么意思？",
                    options: ["小姑娘", "老太太", "阿姨", "姐姐"],
                    answer: "小姑娘"
                },
                {
                    question: "雄起是什么意思？",
                    options: ["躺下", "加油", "起床", "打架"],
                    answer: "加油"
                }
            ];
            
            let currentQuestion = 0;
            let score = 0;
            let selectedOption = null;
            
            const questionElement = document.getElementById('question');
            const optionsContainer = document.getElementById('options-container');
            const submitBtn = document.getElementById('submit-btn');
            const nextBtn = document.getElementById('next-btn');
            const resultContainer = document.getElementById('result-container');
            const resultMessage = document.getElementById('result-message');
            const correctAnswer = document.getElementById('correct-answer');
            const scoreElement = document.getElementById('score');
            const questionNumber = document.querySelector('.question-number');
            
            // 初始化问题
            showQuestion();
            
            // 提交答案
            submitBtn.addEventListener('click', checkAnswer);
            
            // 下一题
            nextBtn.addEventListener('click', function() {
                currentQuestion++;
                if (currentQuestion < questions.length) {
                    showQuestion();
                } else {
                    // 游戏结束
                    showFinalScore();
                }
            });
            
            function showQuestion() {
                const question = questions[currentQuestion];
                questionNumber.textContent = `问题 ${currentQuestion + 1}/${questions.length}`;
                questionElement.textContent = question.question;
                
                // 清空选项容器
                optionsContainer.innerHTML = '';
                
                // 添加选项
                question.options.forEach((option, index) => {
                    const optionElement = document.createElement('div');
                    optionElement.className = 'option';
                    optionElement.textContent = `${String.fromCharCode(65 + index)}. ${option}`;
                    optionElement.dataset.value = option;
                    
                    optionElement.addEventListener('click', function() {
                        // 移除之前的选择
                        document.querySelectorAll('.option').forEach(opt => {
                            opt.classList.remove('selected');
                        });
                        
                        // 添加新选择
                        this.classList.add('selected');
                        selectedOption = this.dataset.value;
                        submitBtn.disabled = false;
                    });
                    
                    optionsContainer.appendChild(optionElement);
                });
                
                // 重置UI状态
                resultContainer.style.display = 'none';
                submitBtn.style.display = 'inline-block';
                nextBtn.style.display = 'none';
                submitBtn.disabled = true;
                selectedOption = null;
            }
            
            function checkAnswer() {
                const correct = questions[currentQuestion].answer;
                
                // 显示结果
                resultContainer.style.display = 'block';
                
                // 标记正确和错误选项
                document.querySelectorAll('.option').forEach(option => {
                    if (option.dataset.value === correct) {
                        option.classList.add('correct');
                    } else if (option.dataset.value === selectedOption && selectedOption !== correct) {
                        option.classList.add('incorrect');
                    }
                });
                
                if (selectedOption === correct) {
                    resultMessage.className = 'correct';
                    resultMessage.innerHTML = '<i class="fas fa-check-circle"></i> 恭喜你，答对了！';
                    score++;
                } else {
                    resultMessage.className = 'incorrect';
                    resultMessage.innerHTML = '<i class="fas fa-times-circle"></i> 很遗憾，答错了！';
                }
                
                correctAnswer.innerHTML = `正确答案: ${correct}`;
                scoreElement.textContent = `得分: ${score}/${questions.length}`;
                
                // 隐藏提交按钮，显示下一题按钮
                submitBtn.style.display = 'none';
                nextBtn.style.display = 'inline-block';
            }
            
            function showFinalScore() {
                questionElement.textContent = "游戏结束！";
                questionNumber.textContent = `完成度: ${questions.length}/${questions.length}`;
                optionsContainer.style.display = 'none';
                submitBtn.style.display = 'none';
                nextBtn.style.display = 'none';
                resultContainer.style.display = 'block';
                
                resultMessage.className = 'correct';
                resultMessage.innerHTML = `最终得分: ${score}/${questions.length}`;
                
                if (score === questions.length) {
                    correctAnswer.innerHTML = '<i class="fas fa-crown"></i> 太棒了！你是四川话专家！';
                } else if (score >= questions.length * 0.7) {
                    correctAnswer.innerHTML = '不错哦！你的四川话水平很好！';
                } else if (score >= questions.length * 0.5) {
                    correctAnswer.innerHTML = '还可以，再多学习一下四川话吧！';
                } else {
                    correctAnswer.innerHTML = '需要多加学习四川话哦！';
                }
            }
        });
    </script>
</body>
</html>

w Error('网站未返回实验编号，请稍后重试。');status.textContent='创建成功，实验编号：'+x.id;document.querySelector('#created').innerHTML='<div class="notice">实验编号：<strong>'+esc(x.id)+'</strong><p class="small">以下链接分别固定版本。请将参与者随机分配到人数相等的四组；不带版本参数的入口为独立随机分配，不保证人数完全平衡。</p>'+[1,2,3,4].map(v=>'<p><a target="_blank" href="?study='+x.id+'&v='+v+'">V'+v+' · '+['A解释优先 → B思考优先','A思考优先 → B解释优先','B解释优先 → A思考优先','B思考优先 → A解释优先'][v-1]+'</a><br><input readonly value="'+location.origin+'/?study='+x.id+'&v='+v+'"></p>').join('')+'<p>随机入口：<a href="?study='+x.id+'" target="_blank">打开实验</a></p></div>';document.querySelector('#export [name=study]').value=x.id;}catch(e){status.textContent='创建未完成：'+e.message;}finally{button.disabled=false;}};document.querySelector('#export').onsubmit=async e=>{e.preventDefault();try{let x=await call('export',Object.fromEntries(new FormData(e.target)));let complete=x.rows.filter(r=>r.Status==='complete');document.querySelector('#results').innerHTML='<div class="notice">'+(x.mode==='pilot'?'预测试':'正式实验')+' · 共'+x.rows.length+'人，完成'+complete.length+'人</div><p>'+[1,2,3,4].map(v=>'V'+v+'：'+x.rows.filter(r=>r.Version==='V'+v).length+'人').join(' / ')+'</p><button id="csv">下载分析数据 CSV</button> <button class="ghost" id="raw">下载完整数据 JSON</button><p class="small">CSV包含原始选项、自动评分、预测偏差、绝对误差、条件差异与逐页时间。退出及未完成样本保留状态标记，分析时请单独筛选。缺失题目得0分，并在Pages中标记。</p>';document.querySelector('#raw').onclick=()=>download(JSON.stringify(x,null,2),'application/json','experiment.json');document.querySelector('#csv').onclick=()=>{if(!x.rows.length)return alert('尚无数据');let keys=[...new Set(x.rows.flatMap(r=>Object.keys(r)))];let cell=v=>'"'+String(v??'').replace(/"/g,'""').replace(/^[=+@\-]/,"'$&")+'"';download('\ufeff'+[keys,...x.rows.map(r=>keys.map(k=>r[k]))].map(row=>row.map(cell).join(',')).join('\r\n'),'text/csv;charset=utf-8','experiment.csv');};}catch(e){err(e);}};}

const reviewMaterials={"A": {"explain": "这种现象被称为**辛普森悖论（Simpson's Paradox）**。\n\n它指的是：当我们分别观察不同群体时，可能发现一种比较趋势；但把群体合并后，总体数据却可能呈现相反的趋势。\n\n造成这种现象的关键，通常在于不同群体的样本数量及其构成比例不同。\n\n举个例子：\n\n某两家医院都接收普通病例和复杂病例。\n\n甲医院在两类病例中的成功率都高于乙医院。\n\n但是，甲医院接收的复杂病例更多，而乙医院接收的普通病例更多。\n\n由于复杂病例本身的成功率较低，即使甲医院在每一类病例中的表现都更好，合并后的总体成功率也可能低于乙医院。\n\n为什么？\n\n因为总体成功率并不是将两类病例的成功率简单相加再除以二。\n\n正确计算方式是：\n\n**总体成功率＝全部成功病例数÷全部病例数。**\n\n不同类型病例所占比例不同，就会影响最终的总体结果。\n\n因此，面对总体数据与分组数据不一致的情况，应进一步检查群体构成，并在具有可比性的分组内进行比较。\n\n这类现象可能出现在医院治疗效果、大学录取率、广告转化率等统计场景中。\n\n**记住一个核心判断：总体比例不仅取决于各组的比例，还取决于各组在总体中占多大比重。**", "attempt": "某地区有甲、乙两家医院，都接收普通病例和复杂病例。\n\n两家医院的手术成功情况如下。\n\n| 病例类型 | 甲医院 | 乙医院 |\n|---|---|---|\n| 普通病例 | 9人成功／10人 | 80人成功／100人 |\n| 复杂病例 | 30人成功／100人 | 2人成功／10人 |\n\n请观察数据，尝试回答：\n\n**如果把两种病例合并计算，哪家医院的总体成功率更高？为什么？**\n\n选项：\n\nA. 甲医院，因为它在两种病例中的成功率都更高。\n\nB. 乙医院，因为两家医院接收的病例构成不同。\n\nC. 两家医院的总体成功率一定相同。\n\nD. 无法根据表格计算。", "tests": ["**问题：哪种广告方案的总体转化率更高？**\n\n一家企业比较甲、乙两种广告方案。\n\n| 用户类型 | 甲方案 | 乙方案 |\n|---|---|---|\n| 老用户 | 8人转化／10人 | 70人转化／100人 |\n| 新用户 | 20人转化／100人 | 1人转化／10人 |\n\n请判断：\n\nA. 甲方案总体转化率更高。\n\nB. 乙方案总体转化率更高。\n\nC. 两者总体转化率相同。\n\nD. 无法判断。", "**问题：为什么总体结果可能与各分组结果相反？**\n\n某研究发现，甲学习方法在两个不同基础水平的学生群体中，平均成绩都高于乙学习方法。\n\n但将所有学生合并后，乙学习方法的总体平均成绩反而更高。\n\n以下哪项最可能解释这种结果？\n\nA. 统计数据出现这种情况，说明至少有一组计算错误。\n\nB. 只要甲方法在每组中表现更好，其总体平均成绩就必然更高。\n\nC. 两种学习方法所对应的学生基础构成不同，可能改变总体加权平均结果。\n\nD. 只要总体样本足够大，就不可能出现这种现象。"]}, "B": {"explain": "这类判断涉及**基率忽视（Base-rate Neglect）**。\n\n基率指某件事情在总体中原本发生的比例。\n\n例如，某商品存在质量问题的比例为10%，那么10%就是这一问题在相关商品群体中的基础发生率。\n\n人们在判断检测结果时，容易特别关注检测工具的准确程度，却忽略事件本身发生的比例。\n\n假设有1000件商品：\n\n其中100件存在质量问题，900件没有问题。\n\n某检测系统能够识别80%的问题商品，同时会把10%的正常商品错误标记为有问题。\n\n那么：\n\n真正有问题且被标记的商品有80件。\n\n没有问题但被错误标记的商品有90件。\n\n因此，被标记的商品一共有170件。\n\n其中真正有问题的只有80件。\n\n所以，一件被标记商品真正有问题的概率是：\n\n**80÷170≈47.1%。**\n\n这说明，即使检测系统具有较高的识别能力，被标记的商品也未必大概率存在问题。\n\n原因在于：如果正常商品本身占绝大多数，即使错误标记比例不高，也可能产生不少错误标记。\n\n判断检测结果时，需要同时考虑：\n\n1. 问题原本发生的比例。\n2. 系统正确识别问题的能力。\n3. 系统错误标记正常对象的比例。\n\n**记住一个核心判断：检测出问题的概率，不等于检测结果为阳性之后真的有问题的概率。**", "attempt": "某电商平台使用AI系统检测商品是否存在质量问题。\n\n已知：\n\n- 在1000件商品中，平均有100件存在质量问题。\n- 对于有问题的商品，系统能正确标记其中的90%。\n- 对于没有问题的商品，系统也会错误标记其中的10%。\n\n现在，一件商品被系统标记为“可能存在质量问题”。\n\n请判断：\n\n**这件商品真的存在质量问题的概率大约是多少？**\n\nA. 10%。\n\nB. 50%。\n\nC. 90%。\n\nD. 100%。", "tests": ["**问题：被识别的异常订单，真的异常吗？**\n\n某平台对1000笔订单进行风险识别。\n\n已知：\n\n- 其中20%的订单确实存在异常。\n- 系统能够识别90%的异常订单。\n- 对于正常订单，系统的错误标记率为10%。\n\n一笔订单被系统标记为异常后，它真正异常的概率约为多少？\n\nA. 20%。\n\nB. 50%。\n\nC. 69%。\n\nD. 90%。", "**问题：为什么同一个检测系统在不同人群中的阳性结果可信度可能不同？**\n\n某检测系统在甲、乙两个人群中使用。\n\n系统对两个人群的识别率和误报率完全相同。\n\n但甲群体中目标问题的实际发生率为20%，乙群体仅为1%。\n\n以下哪项判断最合理？\n\nA. 两个人群的阳性结果可信度一定相同。\n\nB. 甲群体中的阳性结果通常更可能对应真实问题。\n\nC. 乙群体中的阳性结果通常更可能对应真实问题。\n\nD. 只要检测系统的性能不变，基础发生率就不会影响结果判断。"]}};
